[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vunit-osvvm"
version = "0.1.1"
description = "A VUnit package providing the OSVVM VHDL library."
urls = {homepage = "https://github.com/VUnit/vunit-osvvm"}
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE.md"]
authors = [
  {name = "Lars Asplund", email = "lars.anders.asplund@gmail.com"}
]
keywords = ["vunit", "vunitpkg", "verification", "vhdl", "fpga", "asic", "osvvm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Natural Language :: English",
  "Intended Audience :: Developers",
]

[tool.setuptools]
# Don't include files in the wheel unless specified in [tool.setuptools.package-data].
include-package-data = false

[tool.setuptools.packages.find]
# Search for Python packages (dictionary containing __init__.py) starting at this point.
where = ["src"]

# Only include the Python package named "vunit_osvvm".
# This prevents accidentally packaging unrelated directories.
include = ["vunit_osvvm"]

[tool.setuptools.package-data]
# Declare non-Python files that should be included inside
# the vunit_osvvm Python package in both the wheel and sdist.
# All paths are relative to the vunit_osvvm/ package directory.
vunit_osvvm = [
  "vunit_pkg.toml",
  "hdl/*.vhd",
  "hdl/deprecated/*.vhd",
]

[tool.black]
line-length = 120
extend-exclude = "src/vunit_osvvm/hdl"

[tool.pylint.main]
ignore = ["hdl"]

[tool.pydocstyle]
match-dir = "^(?!hdl).*"
